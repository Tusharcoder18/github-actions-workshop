name: Intro - YAML Syntax

on:
    workflow_dispatch:

jobs:
    initial:
        runs-on: ubuntu-latest
        steps:
            - run: echo "This is the initial job"

    fanout1:
        runs-on: ubuntu-latest
        needs: initial
        steps:
            - run: echo "This runs after the initial job in parallel to fanout 2"

    fanout2:
        runs-on: ubuntu-latest
        needs: initial
        steps:
            - run: echo "This runs after the initial job in parallel to fanout 1"

    fanin:
        runs-on: ubuntu-latest
        needs: [fanout1, fanout2]
        steps:
            - run: echo "This runs after the fanout jobs"
    
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix: 
                configuration: [debug, release]
        steps:
            - run: echo "This job builds the configuration ${{matrix.configuration}}
    
    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - run: echo "This job will be run after the build job"

    ring01:
        runs-on: macos-latest
        needs: test
        steps:
            - run: echo "This job will be run after the test job in parallel to other ring jobs"
    
    ring02:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - run: echo "This job will be run after the test job in parallel to other ring jobs"

    ring03:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - run: echo "This job will be run after the test job in parallel to other ring jobs"

    ring04:
        runs-on: ubuntu-latest
        needs: [ring01, ring02, ring03]
        steps:
            - run: echo "This job will be run after the ring jobs"

    prod:
        runs-on: ubuntu-latest
        needs: ring04
        steps:
            - run: echo "This job will be run after ring04 job"