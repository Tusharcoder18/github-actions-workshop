name: Env variables and secrets

on: workflow_dispatch



jobs:
    execute:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                environment: [dev, prod]
        
        environment: ${{matrix.environment}}

        steps:
            - name: Display environment variable
              run: |
                echo "Building for environment: ${{matrix.environment}}"
                echo "Environment name: $ENV"
                echo "Environment name length: ${#ENV}"
                echo "Environment name partial: ${ENV:0:1}"
              env:
                ENVIRONMENT: ${{vars.ENVIRONMENT}}
            
            - name: Display environment secrets
              run: |
                echo "Secret Length: $(#SECRET)"
              env:
                SECRET: ${{secrets.SECRET}}

            - name: Display repository variable
              run: |
                echo "Repository variable: ${{vars.REPOSITORY_VARIABLE}}"

