name: React Tic-Tac-Toe CI CD

on:
    workflow_dispatch:
    push:
        paths:
            - '.github/workflows/react-tic-tac-toe-ci-cd.yml'
            - 'src/react/react-tic-tac-toe/**'

env:
    DOCKER_IMAGE: tusharpulakala/react-tic-tac-toe
    CONTEXT_PATH: ./src/react/react-tic-tac-toe
    CI: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                submodules: true

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'

            - name: Install dependencies
              run: npm ci
              working-directory: ${{env.CONTEXT_PATH}}

            - name: Build React App
              run: npm run build
              working-directory: ${{env.CONTEXT_PATH}}

    dockerize:
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2

        - name: Log in to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{secrets.DOCKER_USERNAME}}
            password: ${{secrets.DOCKER_PASSWORD}}

        - name: Build and Push Docker Image
          run: |
            cd ${{env.CONTEXT_PATH}}
            TAG=${{github.sha}}
            docker build -t ${{env.DOCKER_IMAGE}}:$TAG -t ${{env.DOCKER_IMAGE}}:latest .
            docker push ${{env.DOCKER_IMAGE}}:$TAG
            docker push ${{env.DOCKER_IMAGE}}:latest